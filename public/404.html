<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Halaman Tidak Ditemukan / Page Not Found</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fafaf8;
        color: #161c1a;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
      }
      .card {
        width: 100%;
        max-width: 440px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 28px;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 600;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: #0369a1;
        background: #f2f3ef;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 12px;
        font-size: 14px;
        color: #4b5563;
      }
      p:last-of-type {
        margin-bottom: 20px;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 9px 16px;
        font-size: 14px;
        font-weight: 600;
        color: #ffffff;
        background: #0369a1;
        border-radius: 8px;
        text-decoration: none;
      }
      a.btn:hover {
        background: #075985;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">HTTP 404</span>
      <h1>Halaman Tidak Ditemukan / Page Not Found</h1>
      <p>Halaman atau berkas yang diminta tidak tersedia di portal peta ini.</p>
      <p>The requested page or asset could not be found on this map portal.</p>
      <a class="btn" href="/">Kembali ke Peta / Back to Map</a>
    </main>
  </body>
</html>
